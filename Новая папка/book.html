<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      background-image: linear-gradient(rgba(0, 0, 0, 0.623), rgba(0, 0, 0, 0.699)), url(./fon\ 11.jpg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
    }

    .navbar {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      padding: 25px 140px 0;
      text-align: right;
    }

    li {
      list-style-type: none;
      display: inline-block;
      position: relative;
      margin: 0px 25px;
    }

    li a {
      text-decoration: none;
      color: #fff;
      text-transform: uppercase;
      font-size: 20px;
    }

    .book {
      min-height: 100vh;
      padding: 150px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .book h2 {
      font-size: 48px;
      font-weight: 700;
      color: #ff9900;
      margin-bottom: 24px;
    }

    .book form {
      width: 100%;
      max-width: 768px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid #d0ff00;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(0, 217, 255, 0.35);
    }

    .book input,
    .book select {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: transparent;
      border: 1px solid #fff;
      border-radius: 5px;
      outline: none;
    }

    .book select {
      background: rgba(0, 0, 0, 0.55);
      cursor: pointer;
    }

    .book select option {
      background: #111;
      color: #fff;
    }

    .book input[type="date"] {
      color-scheme: dark;        
    }

    .book input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .book input:focus,
    .book select:focus {
      border-color: #00d9ff;
      box-shadow: 0 0 8px rgba(0, 217, 255, 0.6);
    }

    .book button {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 20px;
      font-weight: 700;
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      color: #fff;
      background: transparent;
      border: 2px solid #00d9ff;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s, color 0.3s;
    }

    .book button:hover {
      background: #00d9ff;
      color: #000;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.7);
    }

  </style>
</head>
<body>

  <nav>
    <div class="banner">
        <div class="navbar">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="about.html">About</a>
                </li>
                <li>
                    <a href="contact.html">Contact</a>
                </li>
                <li>
                    <a href="help.html">Help</a>
                </li>
                <li>
                    <a href="book.html">Book</a>
                </li>
            </ul>
        </div>

  <section class="book">
    <h2>Book Your Experience</h2>
    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="tel" placeholder="Phone Number" required>
      <select required>
        <option value="" disabled selected>Modelni tanlang</option>
        <option>Malibu 2</option>
        <option>Malibu 2 xl</option>
        <option>Malibu 2 primer</option>
   
      </select>
      <input type="date" required>
      <button type="submit">Schedule Now</button>
    </form>
  </section>

</body>
</html>
