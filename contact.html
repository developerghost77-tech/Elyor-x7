<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      background-image: linear-gradient(rgba(0, 0, 0, 0.623), rgba(0, 0, 0, 0.699)), url(./fon\ 11.jpg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
    }


    .navbar {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      padding: 25px 60px;
      text-align: right;
    }

    li {
      list-style-type: none;
      display: inline-block;
      position: relative;
      margin: 0px 25px;
    }

    li a {
      text-decoration: none;
      color: #fff;
      text-transform: uppercase;
      font-size: 20px;
    }


    .contact {
      min-height: 100vh;
      padding: 120px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .contact h2 {
      font-size: 48px;
      font-weight: 700;
      color: #4400ff;
      margin-bottom: 24px;
    }

    .contact form {
      width: 100%;
      max-width: 768px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid #d0ff00;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(150, 140, 140, 0.35);
    }

    .contact input,
    .contact textarea {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: transparent;
      border: 1px solid #fff;
      border-radius: 5px;
      outline: none;
    }

    .contact textarea {
      height: 142px;
      resize: vertical;
    }


    .contact button {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 4px;
      font-size: 20px;
      font-weight: 700;
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      color: #fff;
      background: transparent;
      border: 2px solid #1900ff;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.3s, box-shadow 0.3s, color 0.3s;
    }

    .contact button:hover {
      background: #1900ff;
      color: #fff;
      box-shadow: 0 0 20px rgba(0, 247, 164, 0.7);
    }
  </style>
</head>
<body>


 <div class="banner">
        <div class="navbar">

            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="about.html">About</a>
                </li>
                <li>
                    <a href="contact.html">Contact</a>
                </li>
                <li>
                    <a href="help.html">Help</a>
                </li>
                <li>
                    <a href="book.html">Book</a>
                </li>
            </ul>
        </div>
  <section class="contact">
    <h2>Contact Us</h2>
    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

</body>
</html>
